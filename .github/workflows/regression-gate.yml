name: WinScope Performance Regression Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  performance-gate:
    name: Windows Fundamentals Performance & Reliability Gate
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic psutil pywin32 pytest scipy numpy

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Compile Native C# Collector
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\collector\csharp\build.ps1

      - name: Run Automated Test Suite (23 Tests)
        shell: powershell
        run: |
          python -m pytest tests/ -v

      - name: Execute Automated Performance Regression Gate
        shell: powershell
        run: |
          python scripts/run_ci_gate.py
